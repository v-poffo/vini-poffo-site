<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Projetos — Vini Poffo</title>
<link rel="stylesheet" href="css/builder.css">
</head>
<body>

<div class="app">

  <!-- ── TOP BAR ── -->
  <header class="topbar">
    <span class="topbar-logo">Vini Poffo</span>
    <span class="topbar-title">/criar — Gerenciar Projetos</span>
    <div class="topbar-spacer"></div>
    <button class="btn btn-outline btn-sm" id="btnExportJSON" title="Exportar projects.json">Export JSON</button>
    <a href="/" class="btn btn-secondary btn-sm" target="_blank">← Site</a>
  </header>

  <div class="main">

    <!-- ── SIDEBAR: lista de projetos ── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Projetos</span>
        <button class="btn btn-primary btn-sm" id="btnNewProject" title="Novo projeto">+ Novo</button>
      </div>
      <div class="sidebar-projects" id="projectsList">
        <!-- preenchido por builder.js -->
      </div>
    </aside>

    <!-- ── EDITOR ── -->
    <section class="editor">

      <!-- editor topbar -->
      <div class="editor-topbar">
        <div class="editor-tabs">
          <button class="tab-btn active" data-tab="form">Editar</button>
          <button class="tab-btn" data-tab="output">Gerar HTML</button>
        </div>
        <div class="editor-spacer"></div>
        <span id="editorTitle" style="font-size:.72rem;color:var(--dim);letter-spacing:.08em"></span>
      </div>

      <!-- ── FORM TAB ── -->
      <div class="editor-content" id="editorContent">
        <!-- form content renderizado por builder.js -->
        <div class="empty-state">
          <div class="empty-icon">🎬</div>
          <div class="empty-text">Carregando projetos…</div>
        </div>
      </div>

      <!-- ── OUTPUT TAB ── -->
      <div class="editor-content hidden" id="outputContent">
        <!-- gerado dinamicamente -->
      </div>

      <!-- ── ACTION BAR ── -->
      <div class="action-bar">
        <button class="btn btn-primary" id="btnSave">Salvar</button>
        <button class="btn btn-outline" id="btnGenHTML">Gerar HTML</button>
        <button class="btn btn-secondary" id="btnPreview">Preview</button>
        <div style="flex:1"></div>
        <button class="btn btn-danger" id="btnDelete">Deletar</button>
      </div>

    </section>

  </div><!-- /main -->

</div><!-- /app -->

<!-- ── DELETE MODAL ── -->
<div class="modal-overlay hidden" id="deleteModal">
  <div class="modal">
    <div class="modal-title" id="deleteModalTitle">Deletar projeto?</div>
    <div class="modal-text">Esta ação não pode ser desfeita. O projeto será removido do armazenamento local.</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btnCancelDelete">Cancelar</button>
      <button class="btn btn-danger" id="btnConfirmDelete">Deletar</button>
    </div>
  </div>
</div>

<!-- ── TOAST CONTAINER ── -->
<div class="toast-container" id="toastContainer"></div>

<!-- ── SCRIPTS ── -->
<!-- Carrega o builder de páginas compartilhado (assets/js/builder.js) -->
<script src="../../assets/js/builder.js"></script>
<!-- API de CRUD (localStorage) -->
<script src="js/api.js"></script>
<!-- Preview em tempo real -->
<script src="js/preview.js"></script>
<!-- Lógica principal do painel -->
<script src="js/builder.js"></script>

</body>
</html>
