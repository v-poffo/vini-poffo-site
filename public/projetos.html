<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - Vini Poffo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>
    <style>
        @font-face { font-family: 'PP Woodland'; src: url('assets/fonts/PPWoodland-Bold.otf') format('opentype'); font-weight: 700; font-style: normal; font-display: swap; }
        @font-face { font-family: 'AOT Serial Mono'; src: url('assets/fonts/AOTSerialMono-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
        :root { --font-title: 'PP Woodland', sans-serif; --font-text: 'AOT Serial Mono', monospace; }
        .projetos-hero { position: relative; background: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url('assets/hero/todososprojetos.png') center/cover no-repeat; color: var(--primary-white); padding: 8rem 2rem 6rem 2rem; text-align: center; min-height: 500px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .projetos-hero h1.page-title { font-family: var(--font-title); font-weight: 700; }
        .projetos-hero p { color: var(--primary-white); font-size: 1.1rem; max-width: 600px; margin: 0 auto; font-family: var(--font-text); font-weight: 500; }
        .projetos-container { max-width: 1600px; margin: 0 auto; padding: 0 2rem; }
        .projetos-all { padding: 10rem 2rem 6rem 2rem; background-color: var(--primary-black); }
        .filter-buttons { display: flex; gap: 1rem; margin-bottom: 4rem; flex-wrap: wrap; justify-content: center; }
        .filter-btn { padding: 0.7rem 1.5rem; border: 2px solid var(--primary-white); background-color: var(--primary-black); color: var(--primary-white); cursor: pointer; font-family: var(--font-title); font-weight: 700; border-radius: 4px; transition: all 0.3s ease; text-transform: uppercase; font-size: 0.85rem; }
        .filter-btn:hover, .filter-btn.active { background-color: var(--accent-green-light); color: var(--primary-white); border-color: var(--accent-green-light); }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2.5rem; align-items: start; justify-items: center; }
        .polaroid-card { position: relative; text-decoration: none; color: inherit; cursor: pointer; display: block; transform-style: preserve-3d; transition: transform 0.3s ease, box-shadow 0.3s ease; width: 100%; max-width: 320px; opacity: 0; }
        .polaroid-image { opacity: 0; }
        .polaroid-card.animate-in .polaroid-image { animation: revealImageFade 1s ease-out forwards; }
        @keyframes revealImageFade { from { opacity: 0; } to { opacity: 1; } }
        .polaroid-card:nth-child(1) { transform: rotate(-2deg); }
        .polaroid-card:nth-child(2) { transform: rotate(1.5deg); }
        .polaroid-card:nth-child(3) { transform: rotate(-1deg); }
        .polaroid-card:nth-child(4) { transform: rotate(2deg); }
        .polaroid-card:nth-child(5) { transform: rotate(-1.5deg); }
        .polaroid-card:nth-child(6) { transform: rotate(1deg); }
        .polaroid-card:nth-child(7) { transform: rotate(-2.5deg); }
        .polaroid-card:nth-child(8) { transform: rotate(1.5deg); }
        .polaroid-card:hover { transform: rotate(0deg) scale(1.05); z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .polaroid-wrapper { background-color: var(--primary-white); padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; width: 100%; }
        .polaroid-image-container { width: 100%; display: flex; align-items: center; justify-content: center; background-color: var(--primary-white); min-height: 200px; position: relative; }
        .polaroid-image { width: 100%; height: auto; object-fit: contain; display: block; position: relative; }
        .polaroid-label { background-color: var(--primary-white); padding: 1rem 0.8rem; text-align: left; min-height: 50px; display: flex; flex-direction: column; justify-content: center; }
        .polaroid-title { font-size: 0.95rem; font-weight: 600; color: var(--primary-black); margin: 0; line-height: 1.3; }
        .polaroid-year { font-size: 0.8rem; color: var(--dark-gray); margin-top: 0.3rem; }
        .polaroid-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.85); color: var(--primary-white); padding: 1.5rem; display: flex; flex-direction: column; justify-content: center; opacity: 0; transition: opacity 0.3s ease; z-index: 5; font-size: 0.85rem; line-height: 1.5; }
        .polaroid-card:hover .polaroid-overlay { opacity: 1; }
        .polaroid-overlay h4 { margin: 0 0 0.8rem 0; font-size: 1rem; font-weight: 700; }
        .polaroid-overlay p { margin: 0.3rem 0; font-size: 0.8rem; }
        .overlay-label { font-weight: 600; color: var(--accent-green); display: inline; }
        @media (max-width: 1024px) { .projects-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 2rem; } .polaroid-card { max-width: 280px; } }
        @media (max-width: 768px) { .projetos-hero { padding: 4rem 1.5rem; } .projetos-all { padding: 4rem 1.5rem; } .projetos-container { padding: 0 1.5rem; } .filter-buttons { justify-content: flex-start; overflow-x: auto; padding-bottom: 1rem; } .projects-grid { grid-template-columns: 1fr; } .polaroid-card { max-width: 100%; } .polaroid-card:nth-child(n) { transform: rotate(0deg) !important; } .polaroid-card:hover { transform: rotate(0deg) scale(1.02) !important; } }
        .video-modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); animation: fadeIn 0.3s ease; }
        .video-modal-content { position: relative; width: 90%; max-width: 900px; height: 80vh; max-height: 600px; margin: auto; top: 50%; transform: translateY(-50%); border-radius: 4px; overflow: hidden; }
        .video-modal-close { position: absolute; right: 20px; top: 20px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 1001; transition: all 0.3s ease; }
        .video-modal-close:hover { color: var(--accent-green-light); transform: scale(1.2); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 768px) { .video-modal-content { width: 95%; height: 60vh; max-height: 400px; } .video-modal-close { font-size: 30px; right: 10px; top: 10px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="hamburger"><span></span><span></span><span></span></div>
            <ul class="nav-menu">
                <li><a href="index.html#hero">Início.</a></li>
                <li><a href="projetos.html" class="active">Projetos.</a></li>
                <li><a href="index.html#about" onclick="window.location.href='index.html#about';">Sobre.</a></li>
                <li><a href="trabalhos.html">Trabalhos.</a></li>
            </ul>
        </div>
    </nav>
    <section class="projetos-hero">
        <div class="hero-logo-container">
            <a href="index.html">
                <img src="assets/logo/logo.svg" alt="Vini Poffo - Cineasta e Diretora Criativa" class="hero-logo">
            </a>
        </div>
        <div class="projetos-container">
            <h1 class="page-title">Todos os Projetos</h1>
            <p>Explore meu portfólio em cinema, videoclipes e outros projetos.</p>
        </div>
    </section>
    <section class="projetos-all">
        <div class="projetos-container">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">TODOS</button>
                <button class="filter-btn" data-filter="curta-metragem">CURTAS</button>
                <button class="filter-btn" data-filter="videoclipe">VIDEOCLIPES</button>
            </div>
            <div id="projectsGrid" class="projects-grid"></div>
        </div>
    </section>
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2025 Vini Poffo. Todos os direitos reservados.</p>
            <div class="social-links">
                <a href="https://instagram.com/pofovini" target="_blank">Instagram</a>
                <a href="mailto:projetos@vinipoffo.com">Email</a>
            </div>
        </div>
    </footer>
    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            const projectsGrid = document.getElementById('projectsGrid');
            let currentFilter = 'all';
            gsap.registerPlugin(ScrollTrigger);
            function animateCards() {
                const cards = document.querySelectorAll('.polaroid-card');
                const directions = ['left', 'right', 'top', 'bottom'];
                cards.forEach((card, index) => {
                    const direction = directions[index % directions.length];
                    let startX = 0, startY = 0;
                    switch(direction) { case 'left': startX = -100; break; case 'right': startX = 100; break; case 'top': startY = -100; break; case 'bottom': startY = 100; break; }
                    gsap.fromTo(card, { opacity: 0, x: startX, y: startY }, { opacity: 1, x: 0, y: 0, duration: 0.6, delay: index * 0.1, scrollTrigger: { trigger: card, start: 'top 80%', toggleActions: 'play none none none' }, onComplete: () => { card.classList.add('animate-in'); } });
                });
            }
            function renderProjects(filter = 'all') {
                projectsGrid.innerHTML = '';
                const filteredProjects = filter === 'all' ? siteData.projects : siteData.projects.filter(p => p.type === filter);
                filteredProjects.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'polaroid-card';
                    card.style.cursor = 'pointer';
                    const typeLabel = project.type === 'videoclipe' ? 'Videoclipe' : 'Curta-metragem';
                    card.innerHTML = `<div class="polaroid-wrapper"><div class="polaroid-image-container"><img src="assets/cartazes/${project.cartazMobile}" alt="${project.title}" class="polaroid-image" loading="lazy"><div class="polaroid-overlay"><h4>${project.title}</h4><p><span class="overlay-label">Tipo:</span> ${typeLabel}</p><p><span class="overlay-label">Ano:</span> ${project.year}</p>${project.artist ? `<p><span class="overlay-label">Artista:</span> ${project.artist}</p>` : ''}<p style="margin-top:0.8rem;font-size:0.75rem;color:#ccc;">${project.description}</p></div></div><div class="polaroid-label"><h3 class="polaroid-title">${project.title}</h3><p class="polaroid-year">${project.year}</p></div></div>`;
                    card.addEventListener('click', () => { window.location.href = project.customUrl || `projeto.html?id=${project.id}`; });
                    projectsGrid.appendChild(card);
                });
                setTimeout(() => { animateCards(); ScrollTrigger.refresh(); }, 100);
            }
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => { filterButtons.forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentFilter = btn.getAttribute('data-filter'); renderProjects(currentFilter); });
            });
            renderProjects('all');
        });
    </script>
</body>
</html>
